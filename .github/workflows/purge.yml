name: purge old data

on:
    schedule:
        - cron: "0 17 * * 0"
    workflow_dispatch:
        inputs:
            retention_days:
                description: "keep this many days of history (0=keep only today)"
                required: false
                default: "7"
            dry_run:
                description: "only count what would be deleted"
                type: boolean
                default: true

concurrency:
    group: purge-old-data
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    purge:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: worker
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            RETENTION_DAYS: ${{ inputs.retention_days || '7' }}
            DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run ||
                false}}
        steps:
            - name: Check secret
              run: |
                  [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
                  [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }

            - uses: actions/checkout@v6

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: worker/package-lock.json

            - name: install wrangler
              run: npm ci

            - name: purge D1
              run: node /.github/scripts/purge.mjs
