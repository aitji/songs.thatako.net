    <meta property="og:description" content="ขอเพลงเสียงตามสายช่วงเช้า สำหรับงานประชาสัมพันธ์ โรงเรียนท่าตะโกพิทยาคม" />

        content="ขอเพลงเสียงตามสายช่วงเช้า สำหรับงานประชาสัมพันธ์ โรงเรียนท่าตะโกพิทยาคม" />

    <!-- browser / ui -->
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light" />
    <meta name="msapplication-TileColor" content="#ffffff">

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ขอเพลงช่วงเช้า" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- icon -->
    <link rel="apple-touch-icon" sizes="57x57" href="/img/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/img/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/img/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/img/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/img/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/img/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/img/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/android-icon-192x192.png">

    <link rel="manifest" href="/img/manifest.json">

    <!-- web app -->
    <link rel="manifest" href="/img/manifest.webmanifest" />
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-inner">
                <span class="topbar-title">เสียงตามสายตอนเช้า</span>
                <button id="help-btn" class="icon-btn" type="button" aria-label="วิธีใช้งาน">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
                        <path d="M9.5 9.3a2.5 2.5 0 1 1 3.3 2.4c-.9.3-1.3.9-1.3 1.9" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" />
                        <circle cx="12" cy="16.6" r="0.9" fill="currentColor" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="app-content">
            <!-- TAB: request -->
            <section id="panel-request" class="tab-panel" data-panel="request">

                <section class="card">
                    <h2><span class="dot-bullet"></span>กำลังเปิดอยู่</h2>
                    <div id="now-playing" class="now-playing-row">
                        <div class="skeleton-row">
                            <div class="skeleton skeleton-thumb"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-line w-60"></div>
                            </div>
                        </div>
                    </div>
                    <div id="now-playing-context" class="now-playing-context" hidden></div>
                </section>

                <div id="queue-warning" class="queue-warning"></div>

                <section class="card">
                    <h2><span class="dot-bullet"></span>ขอเพลง</h2>
                    <div id="status-line" class="status-line">
                        <span class="status-dot"></span><span>กำลังโหลดสถานะ...</span>
                    </div>
                    <form id="request-form">
                        <label for="youtube-url">ลิงก์ยูทูบ</label>
                        <input type="url" id="youtube-url" placeholder="https://youtu.be/..." required />
                        <div class="hint">แนะนำให้ส่งเพลงแบบปกติ (ไม่ใช่ MV) จะเปิดผ่านเสียงตามสายได้เหมาะกว่า</div>

                        <label for="nickname">ชื่อเล่น (ไม่บังคับ)</label>
                        <input type="text" id="nickname" placeholder="ไม่ใส่ก็ได้" maxlength="24" />

                        <button type="submit" id="submit-btn" class="btn-primary" disabled>
                            <span id="submit-btn-label">ขอเพลง</span>
                        </button>
                        <div id="form-status" class="sr-only" role="status" aria-live="polite"></div>
                    </form>
                    <div id="cap-note" class="cap-note"></div>
                </section>

                <details class="card collapsible">
                    <summary><span class="dot-bullet"></span>คิวเพลงตอนนี้</summary>
                    <div class="collapsible-body">
                        <div id="queue-list">
                            <div class="skeleton-row">
                                <div class="skeleton skeleton-thumb"></div>
                                <div style="flex:1">
                                    <div class="skeleton skeleton-line w-80"></div>
                                </div>
                            </div>
                            <div class="skeleton-row">
                                <div class="skeleton skeleton-thumb"></div>
                                <div style="flex:1">
                                    <div class="skeleton skeleton-line w-60"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </details>

                <details class="card collapsible" id="recent-played-card" hidden>
                    <summary><span class="dot-bullet"></span>เพิ่งเล่นไป</summary>
                    <div class="collapsible-body">
                        <div id="recent-played-list"></div>
                    </div>
                </details>
            </section>

            <!-- tab: me -->
            <section id="panel-me" class="tab-panel" data-panel="me" hidden>

                <section class="card">
                    <h2><span class="dot-bullet"></span>โควตาวันนี้</h2>
                    <div id="quota-summary">
                        <div class="skeleton skeleton-line w-40"></div>
                    </div>
                </section>

                <section class="card">
                    <h2><span class="dot-bullet"></span>คำขอของคุณ</h2>
                    <div id="mine-list">
                        <div class="skeleton-row">
                            <div class="skeleton skeleton-thumb"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-line w-60"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </section>

        </main>

        <nav class="tabbar" role="tablist">
            <button class="tab-btn active" data-tab="request" role="tab" aria-selected="true">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none">
                    <path d="M4 12l16-7-6 16-2.5-6.5L4 12z" stroke="currentColor" stroke-width="1.8"
                        stroke-linejoin="round" stroke-linecap="round" />
                </svg>
                <span>ขอเพลง</span>
            </button>
            <button class="tab-btn" data-tab="me" role="tab" aria-selected="false">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none">
                    <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8" />
                    <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" />
                </svg>
                <span id="tab-me-label">ของฉัน</span>
                <span class="tab-badge" id="tab-me-badge" hidden></span>
            </button>
        </nav>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sse.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/time.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
