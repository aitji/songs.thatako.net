<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>ห้องควบคุมเสียงตามสาย / MSR</title>
    <meta name="description" content="ห้องควบคุมเสียงตามสายสำหรับงานประชาสัมพันธ์ โรงเรียนท่าตะโกพิทยาคม" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="language" content="th" />

    <link rel="stylesheet" href="css/style.css" />

    <!-- browser / ui -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ห้องควบคุมเสียงตามสาย" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-icon-180x180.png" />
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
</head>

<body>
    <section id="login-section" class="login-shell">
        <div class="brand">ห้องควบคุมเสียงตามสาย</div>
        <div class="card">
            <form id="login-form">
                <label for="password-input">รหัสผ่าน PR</label>
                <input type="password" id="password-input" required autofocus />
                <button type="submit" id="login-btn" class="btn-primary">
                    <span id="login-btn-label">เข้าสู่ระบบ</span>
                </button>
            </form>
        </div>
    </section>

    <div id="panel-section" class="admin-shell" style="display:none">
        <div class="admin-topbar">
            <h1>ห้องควบคุมเสียงตามสาย</h1>
            <div class="admin-topbar-right">
                <button id="help-btn" class="icon-btn" type="button" aria-label="วิธีใช้งาน">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
                        <path d="M9.5 9.3a2.5 2.5 0 1 1 3.3 2.4c-.9.3-1.3.9-1.3 1.9" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" />
                        <circle cx="12" cy="16.6" r="0.9" fill="currentColor" />
                    </svg>
                </button>
                <button id="logout-btn" class="btn-ghost">ออกจากระบบ</button>
            </div>
        </div>

        <div class="admin-grid">
            <div>
                <section class="card">
                    <h2><span class="dot-bullet"></span>ตั้งค่า</h2>

                    <div id="settings-status" class="status-line">
                        <span class="status-dot"></span><span>กำลังโหลด...</span>
                    </div>

                    <div class="field-row">
                        <label for="request-open-toggle">รับคำขอเพลง</label>
                        <label class="switch">
                            <input type="checkbox" id="request-open-toggle" />
                            <span class="switch-track"></span>
                        </label>
                    </div>

                    <label for="cap-input">จำนวนสูงสุดต่อคน</label>
                    <input type="text" inputmode="numeric" id="cap-input" />

                    <div class="time-row">
                        <div>
                            <label for="open-time-input">เปิดรับตอน</label>
                            <input type="time" id="open-time-input" />
                        </div>
                        <div>
                            <label for="close-time-input">ปิดรับตอน</label>
                            <input type="time" id="close-time-input" />
                        </div>
                    </div>

                    <button id="settings-save-btn" class="btn-primary">
                        <span id="settings-save-label">บันทึกการตั้งค่า</span>
                    </button>
                    <button id="settings-reset-btn" class="btn-danger-outline"
                        type="button">รีเซ็ตเป็นค่าเริ่มต้น</button>
                    <div id="settings-status-msg" class="sr-only" role="status" aria-live="polite"></div>
                </section>

                <section class="card">
                    <h2><span class="dot-bullet"></span>เพิ่มเพลงเอง</h2>
                    <form id="add-song-form">
                        <label for="add-youtube-url">ลิงก์ยูทูบ</label>
                        <input type="url" id="add-youtube-url" placeholder="https://youtu.be/..." required />
                        <label for="add-nickname">ป้ายชื่อ (ไม่บังคับ)</label>
                        <input type="text" id="add-nickname" placeholder="เช่น เพลงเปิดท้ายชั่วโมง" maxlength="24" />
                        <button type="submit" id="add-song-btn" class="btn-primary">
                            <span id="add-song-label">เพิ่มเข้าคิว</span>
                        </button>
                        <div id="add-song-status" class="sr-only" role="status" aria-live="polite"></div>
                    </form>
                </section>
            </div>

            <div>
                <section class="card">
                    <h2><span class="dot-bullet"></span>กำลังเปิด</h2>
                    <div id="admin-now-playing">
                        <div class="skeleton-row">
                            <div class="skeleton skeleton-thumb"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-line w-60"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2><span class="dot-bullet"></span>คิว</h2>
                    <div id="admin-queue">
                        <div class="skeleton-row">
                            <div class="skeleton skeleton-thumb"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-line w-80"></div>
                            </div>
                        </div>
                        <div class="skeleton-row">
                            <div class="skeleton skeleton-thumb"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-line w-60"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2><span class="dot-bullet"></span>เล่นแล้ว</h2>
                    <div id="admin-played">
                        <p class="empty-hint">ยังไม่มีเพลงที่เปิดแล้ว</p>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sse.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/time.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
